<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>YH Launcher</title>
    <link rel="stylesheet" href="style.css" />
    <script src="boot.js"></script>
  </head>
  <body>
    <div id="panel" class="panel">
      <header class="searchbar">
        <span class="search-icon" data-icon="search"></span>
        <input id="q" type="text" placeholder="YH Launcher'da ara" spellcheck="false" autocomplete="off" />
        <span id="mode" class="mode-chip hidden"></span>
      </header>

      <main id="list" class="list" role="listbox">
        <div id="list-inner" class="list-inner"></div>
      </main>

      <div id="settings" class="settings hidden"></div>

      <footer class="footer">
        <button id="btn-settings" class="footer-btn brand" title="Ayarlar (Ctrl+,)">
          <img src="../../assets/logo.png" alt="" class="footer-logo" />
          <span>YH Launcher</span>
        </button>
        <span class="footer-spacer"></span>
        <span id="primary-hint" class="footer-hint"><span id="primary-label">Aç</span><kbd>↵</kbd></span>
        <span class="footer-divider"></span>
        <button id="btn-actions" class="footer-btn" title="Eylemler (Ctrl+K)">
          <span>Eylemler</span>
          <kbd>Ctrl</kbd><kbd>K</kbd>
        </button>
      </footer>

      <div id="toast" class="toast" role="status"></div>
      <div id="actions" class="actions" role="menu"></div>
    </div>
    <script src="icons.js"></script>
    <script src="settings.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
